l&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="27" x="793.5" y="97.7363">tags</text><line style="stroke:#444444;stroke-width:0.5;" x1="662" x2="952" y1="105.8125" y2="105.8125"/><ellipse cx="672" cy="120.1172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266" x="681" y="124.3457">_id : INTEGER &#171;PK&#187; &#171;AUTOINCREMENT&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="662" x2="952" y1="131.4219" y2="131.4219"/><ellipse cx="672" cy="145.7266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217" x="681" y="149.9551">name : TEXT &#171;UNIQUE, NOCASE&#187;</text></g><!--class question_tags--><g id="elem_question_tags"><rect codeLine="49" fill="#FFFFFF" height="111.5313" id="question_tags" rx="2" ry="2" style="stroke:#444444;stroke-width:0.5;" width="247" x="537.5" y="252.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="57" x="632.5" y="270.0664">&#171;junction&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89" x="616.5" y="287.2363">question_tags</text><line style="stroke:#444444;stroke-width:0.5;" x1="538.5" x2="783.5" y1="295.3125" y2="295.3125"/><ellipse cx="548.5" cy="309.6172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221" x="557.5" y="313.8457">question_id : INTEGER &#171;PK&#187; &#171;FK&#187;</text><ellipse cx="548.5" cy="327.2266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187" x="557.5" y="331.4551">tag_id : INTEGER &#171;PK&#187; &#171;FK&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="538.5" x2="783.5" y1="338.5313" y2="338.5313"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220" x="543.5" y="357.0645">composite PK (question_id, tag_id)</text></g><!--link questions to question_tags--><g id="link_questions_question_tags"><path codeLine="59" d="M532.1292,172.2981 C556.0692,200.3881 575,222.6094 575,222.6094 C575,222.6094 575.8483,223.4457 592.2783,239.6857 " fill="none" id="questions-question_tags" style="stroke:#333333;stroke-width:1.0;"/><line style="stroke:#333333;stroke-width:1.0;" x1="526.4902" x2="532.5789" y1="171.8483" y2="166.6591"/><line style="stroke:#333333;stroke-width:1.0;" x1="528.4362" x2="534.5249" y1="174.1316" y2="168.9424"/><line style="stroke:#333333;stroke-width:1.0;" x1="532.1292" x2="526.94" y1="172.2981" y2="166.2094"/><line style="stroke:#333333;stroke-width:1.0;" x1="599.3903" x2="609.2979" y1="246.7155" y2="248.0721"/><line style="stroke:#333333;stroke-width:1.0;" x1="599.3903" x2="600.8621" y1="246.7155" y2="256.6066"/><line style="stroke:#333333;stroke-width:1.0;" x1="599.3903" x2="605.08" y1="246.7155" y2="252.3394"/><ellipse cx="595.1231" cy="242.4976" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140" x="576" y="219.1045">ON DELETE CASCADE</text></g><!--link tags to question_tags--><g id="link_tags_question_tags"><path codeLine="60" d="M767.9978,163.6002 C746.8378,192.0702 735.0745,207.9104 712.7645,237.9404 " fill="none" id="tags-question_tags" style="stroke:#333333;stroke-width:1.0;"/><line style="stroke:#333333;stroke-width:1.0;" x1="767.1735" x2="773.5943" y1="158.0037" y2="162.7758"/><line style="stroke:#333333;stroke-width:1.0;" x1="765.384" x2="771.8047" y1="160.4115" y2="165.1836"/><line style="stroke:#333333;stroke-width:1.0;" x1="767.9978" x2="772.77" y1="163.6002" y2="157.1794"/><line style="stroke:#333333;stroke-width:1.0;" x1="706.8009" x2="706.8463" y1="245.9676" y2="255.9675"/><line style="stroke:#333333;stroke-width:1.0;" x1="706.8009" x2="697.2137" y1="245.9676" y2="248.8112"/><line style="stroke:#333333;stroke-width:1.0;" x1="706.8009" x2="702.03" y1="245.9676" y2="252.3894"/><ellipse cx="710.379" cy="241.1513" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140" x="735" y="219.1045">ON DELETE CASCADE</text></g><rect fill="#DDDDDD" height="256.5313" id="_legend" rx="2" ry="2" style="stroke:#000000;stroke-width:1.0;" width="652" x="147" y="382.1406"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59" x="152" y="401.6738">Notation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="409" x="219" y="401.6738">Crow's foot.  || = exactly one   |o = zero or one   o{ = zero or many</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5" x="152" y="419.2832">*</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="633" x="161" y="419.2832">= mandatory (NOT NULL).  _id is an INTEGER PRIMARY KEY (rowid alias) and can never hold NULL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="152" y="436.8926">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111" x="152" y="454.502">Explicit indexes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="332" x="152" y="472.1113">idx_question_tags_tag       ON question_tags(tag_id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="152" y="489.7207">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="44" x="152" y="507.3301">Scope</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="469" x="204" y="507.3301">Every table is global; no table carries a user_id, so all content is shared by</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="559" x="152" y="524.9395">every user. users has no foreign key relationship to any other table; it backs sign-in only.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="152" y="542.5488">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="149" x="152" y="560.1582">Runtime dependency</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="337" x="309" y="560.1582">No FK action above is enforced by the schema alone.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="509" x="152" y="577.7676">MemForceDbHelper.onConfigure() calls setForeignKeyConstraintsEnabled(true);</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="536" x="152" y="595.377">without it SQLite defaults PRAGMA foreign_keys = OFF and every CASCADE is inert.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="152" y="612.9863">--</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="385" x="152" y="630.5957">No table declares a DEFAULT. No table is WITHOUT ROWID.</text><!--SRC=[lLPBS-8u4BxxLtInXq0gG6tjd1925G4pGoM1387DpecIxSRMH9Qyae0mZ_- -BTayieyaKrkxEb2crUh7fw-xTGAtc0-LZX6K