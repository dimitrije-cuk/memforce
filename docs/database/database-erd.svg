if" font-size="14" lengthAdjust="spacing" textLength="145.5098" x="26" y="155.0645">password_hash : TEXT</text><ellipse cx="17" cy="168.4453" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.2344" x="26" y="172.6738">salt : TEXT</text></g><!--class questions--><g id="elem_questions"><rect codeLine="33" fill="#FFFFFF" height="111.5313" id="questions" rx="2" ry="2" style="stroke:#444444;stroke-width:0.5;" width="298.2891" x="322" y="59.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.375" x="448.457" y="76.5664">&#171;global&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9307" x="441.1792" y="93.7363">questions</text><line style="stroke:#444444;stroke-width:0.5;" x1="323" x2="619.2891" y1="101.8125" y2="101.8125"/><ellipse cx="333" cy="116.1172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.2891" x="342" y="120.3457">_id : INTEGER &#171;PK&#187; &#171;AUTOINCREMENT&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="323" x2="619.2891" y1="127.4219" y2="127.4219"/><ellipse cx="333" cy="141.7266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.4688" x="342" y="145.9551">name : TEXT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.3027" x="342" y="163.5645">answer : TEXT &#171;nullable&#187;</text></g><!--class tags--><g id="elem_tags"><rect codeLine="40" fill="#FFFFFF" height="93.9219" id="tags" rx="2" ry="2" style="stroke:#444444;stroke-width:0.5;" width="298.2891" x="647" y="68.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.375" x="773.457" y="85.5664">&#171;global&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.4619" x="782.9136" y="102.7363">tags</text><line style="stroke:#444444;stroke-width:0.5;" x1="648" x2="944.2891" y1="110.8125" y2="110.8125"/><ellipse cx="658" cy="125.1172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.2891" x="667" y="129.3457">_id : INTEGER &#171;PK&#187; &#171;AUTOINCREMENT&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="648" x2="944.2891" y1="136.4219" y2="136.4219"/><ellipse cx="658" cy="150.7266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.2822" x="667" y="154.9551">name : TEXT &#171;UNIQUE, NOCASE&#187;</text></g><!--class alternative_answers--><g id="elem_alternative_answers"><rect codeLine="46" fill="#FFFFFF" height="111.5313" id="alternative_answers" rx="2" ry="2" style="stroke:#444444;stroke-width:0.5;" width="340.3369" x="292" y="235.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="45.375" x="439.481" y="253.0664">&#171;global&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="124.5098" x="399.9136" y="270.2363">alternative_answers</text><line style="stroke:#444444;stroke-width:0.5;" x1="293" x2="631.3369" y1="278.3125" y2="278.3125"/><ellipse cx="303" cy="292.6172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.2891" x="312" y="296.8457">_id : INTEGER &#171;PK&#187; &#171;AUTOINCREMENT&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="293" x2="631.3369" y1="303.9219" y2="303.9219"/><ellipse cx="303" cy="318.2266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.8613" x="312" y="322.4551">question_id : INTEGER &#171;FK&#187;</text><ellipse cx="303" cy="335.8359" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="314.3369" x="312" y="340.0645">answer : TEXT &#171;UNIQUE per question, NOCASE&#187;</text></g><!--class question_tags--><g id="elem_question_tags"><rect codeLine="56" fill="#FFFFFF" height="111.5313" id="question_tags" rx="2" ry="2" style="stroke:#444444;stroke-width:0.5;" width="246.999" x="661.5" y="235.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="54.709" x="757.645" y="253.0664">&#171;junction&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.1787" x="741.4102" y="270.2363">question_tags</text><line style="stroke:#444444;stroke-width:0.5;" x1="662.5" x2="907.499" y1="278.3125" y2="278.3125"/><ellipse cx="672.5" cy="292.6172" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.999" x="681.5" y="296.8457">question_id : INTEGER &#171;PK&#187; &#171;FK&#187;</text><ellipse cx="672.5" cy="310.2266" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.5303" x="681.5" y="314.4551">tag_id : INTEGER &#171;PK&#187; &#171;FK&#187;</text><line style="stroke:#444444;stroke-width:1.0;" x1="662.5" x2="907.499" y1="321.5313" y2="321.5313"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.123" x="667.5" y="340.0645">composite PK (question_id, tag_id)</text></g><line style="stroke:#333333;stroke-width:1.0;" x1="564.4155" x2="568.5221" y1="176.7252" y2="169.8596"/><line style="stroke:#333333;stroke-width:1.0;" x1="566.9901" x2="571.0967" y1="178.2651" y2="171.3995"/><line style="stroke:#333333;stroke-width:1.0;" x1="569.9016" x2="563.036" y1="175.3457" y2="171.2391"/><line style="stroke:#333333;stroke-width:1.0;" x1="667.4342" x2="677.3048" y1="231.8729" y2="230.2697"/><line style="stroke:#333333;stroke-width:1.0;" x1="667.4342" x2="671.737" y1="231.8729" y2="240.8999"/><line style="stroke:#333333;stroke-width:1.0;" x1="667.4342" x2="674.5209" y1="231.8729" y2="235.5848"/><ellipse cx="662.1191" cy="229.089" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1.0;"/><path d="M569.9016,175.3457 C607.5752,197.8798 636.5972,215.1828 641,217.6094 C651.8009,223.5622 647.1977,221.2736 658.5757,227.2331 " fill="none" style="stroke:#333333;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1436" x="643" y="213.1045">ON DELETE CASCADE</text><line style="stroke:#333333;stroke-width:1.0;" x1="788.8374" x2="796.8215" y1="166.1545" y2="166.6578"/><line style="stroke:#333333;stroke-width:1.0;" x1="788.6486" x2="796.6328" y1="169.1485" y2="169.6518"/><line style="stroke:#333333;stroke-width:1.0;" x1="792.5778" x2="793.0811" y1="170.3982" y2="162.414"/><line style="stroke:#333333;stroke-width:1.0;" x1="788.9841" x2="794.4689" y1="227.4067" y2="235.7683"/><line style="stroke:#333333;stroke-width:1.0;" x1="788.9841" x2="782.4927" y1="227.4067" y2="235.0134"/><line style="stroke:#333333;stroke-width:1.0;" x1="788.9841" x2="788.4808" y1="227.4067" y2="235.3909"/><ellipse cx="789.3616" cy="221.4186" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1.0;"/><path d="M792.5778,170.3982 C791.1648,192.8135 791.0936,193.9432 789.6132,217.4265 " fill="none" style="stroke:#333333;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1436" x="792" y="213.1045">ON DELETE CASCADE</text><line style="stroke:#333333;stroke-width:1.0;" x1="460.5894" x2="468.5583" y1="174.9299" y2="175.6353"/><line style="stroke:#333333;stroke-width:1.0;" x1="460.3249" x2="468.2938" y1="177.9183" y2="178.6236"/><line style="stroke:#333333;stroke-width:1.0;" x1="464.2212" x2="464.9265" y1="179.267" y2="171.2982"/><line style="stroke:#333333;stroke-width:1.0;" x1="461.9125" x2="467.7995" y1="227.5068" y2="235.5903"/><line style="stroke:#333333;stroke-width:1.0;" x1="461.9125" x2="455.8007" y1="227.5068" y2="235.4218"/><line style="stroke:#333333;stroke-width:1.0;" x1="461.9125" x2="461.8001" y1="227.5068" y2="235.506"/><ellipse cx="461.9968" cy="221.5074" fill="none" rx="4" ry="4" style="stroke:#333333;stroke-width:1.0;"/><path d="M464.2212,179.267 C463.443,188.0584 463.463,189.0916 463,197.6094 C462.334,209.8628 462.2281,205.0391 462.053,217.5078 " fill="none" style="stroke:#333333;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.1436" x="465" y="213.1045">ON DELETE CASCADE</text><rect fill="#DDDDDD" height="326.9688" id="_legend" rx="2" ry="2" style="stroke:#000000;stroke-width:1.0;" width="693.1768" x="125.4116" y="353.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="56.7656" x="130.4116" y="373.1426">Notation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="406.9502" x="194.9565" y="373.1426">Crow's foot.  || = exactly one   |o = zero or one   o{ = zero or many</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5.4482" x="130.4116" y="390.752">*</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="636.0703" x="139.7495" y="390.752">= mandatory (NOT NULL).  _id is an INTEGER PRIMARY KEY (rowid alias) and can never hold NULL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9.3242" x="130.4116" y="408.3613">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="105.8203" x="130.4116" y="425.9707">Explicit indexes</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="338.543" x="130.4116" y="443.5801">idx_question_tags_tag          ON question_tags(tag_id)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="683.1768" x="130.4116" y="461.1895">idx_alternative_answers_answer ON alternative_answers(question_id, answer COLLATE NOCASE)  UNIQUE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9.3242" x="130.4116" y="478.7988">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="132.2822" x="130.4116" y="496.4082">Alternative answers</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="393.7637" x="270.4731" y="496.4082">Further wordings of questions.answer that the game accepts as</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="555.5908" x="130.4116" y="514.0176">correct as well. The row order is the ascending _id, which is the order they were stored in.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9.3242" x="130.4116" y="531.627">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="42.0137" x="130.4116" y="549.2363">Scope</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="459.915" x="180.2046" y="549.2363">Every table is global; no table carries a user_id, so all content is shared by</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="547.0664" x="130.4116" y="566.8457">every user. users has no foreign key relationship to any other table; it backs sign-in only.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9.3242" x="130.4116" y="584.4551">--</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="141.5791" x="130.4116" y="602.0645">Runtime dependency</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="332.3018" x="279.77" y="602.0645">No FK action above is enforced by the schema alone.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="501.1016" x="130.4116" y="619.6738">MemForceDbHelper.onConfigure() calls setForeignKeyConstraintsEnabled(true);</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="532.6016" x="130.4116" y="637.2832">without it SQLite defaults PRAGMA foreign_keys = OFF and every CASCADE is inert.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="9.3242" x="130.4116" y="654.8926">--</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="387.4268" x="130.4116" y="672.502">No table declares a DEFAULT. No table is WITHOUT ROWID.</text><!--SRC=[lLTDSzis4BtpLspTGwICBSsqESMEPnIPIZMsPKUMc-RaWSWrYGG4M02oh2Rvxtq0QKbEd3YPVl0WKOlTnUxRnUBffzgAeXAanCeiFBcAlT0YUKAdN8sCpPYCtilvHkBjulM9z4mkAxaIFUXSc4NKk2Pl5xvyJgAk-yvc_Kf8tNydRaG_CrM_ukewkEhdy_wTswFvRwngjhsWHHsZXvQ5vowyZdFMNbvBjeuiEwDkE2TVMhCeo